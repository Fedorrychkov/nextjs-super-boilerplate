name: Reusable Deploy Config

on:
  workflow_call:
    inputs:
      domain:
        description: Target domain
        required: true
        type: string
      api_env:
        description: API env (stage|prod|feature)
        required: true
        type: string
      env_file:
        description: .env file path
        required: true
        type: string
      nginx_mode:
        description: http|https
        required: true
        type: string
      certbot_test_mode:
        description: Use certbot staging
        required: false
        default: false
        type: boolean
      migrations_run:
        description: Enable database migrations
        required: false
        default: false
        type: boolean
      blue_green_enabled:
        description: Enable blue-green deployment
        required: false
        default: false
        type: boolean
      deploy_mode:
        description: 'Deploy mode: empty/default = build on server; registry = build in CI and use image from GHCR'
        required: false
        default: ''
        type: string

      node_version:
        description: Node.js version
        required: false
        default: 24
        type: number

      registry_subname:
        description: 'Subname for registry image (for example: web)'
        required: false
        default: ''
        type: string

      notify_enabled:
        description: Enable notification
        required: false
        default: false
        type: boolean

      tag:
        description: Tag for notification
        required: false
        default: ''
        type: string

      redis_enabled:
        description: Enable Redis (pull and start redis container)
        required: false
        default: false
        type: boolean
      metrics_enabled:
        description: Enable metrics/monitoring stack (prometheus, grafana, loki, etc.)
        required: false
        default: false
        type: boolean
      mongo_enabled:
        description: Enable MongoDB container (local). If false, use external cluster via MONGO_URI in env.
        required: false
        default: false
        type: boolean
      worker_enabled:
        description: Enable the background worker container (scripts/worker.ts, BullMQ crons). Needs Redis (REDIS_URL).
        required: false
        default: false
        type: boolean

      server_memory_mb:
        description: 'Total server RAM in MB (e.g. 2048). Derives per-container memory limits via scripts/lib/memory-limits.sh. 0 = keep compose defaults (api 2g, redis/mongo unlimited).'
        required: false
        default: 0
        type: number
      api_mem_limit:
        description: 'Override core-api memory limit (e.g. 768M). Wins over server_memory_mb.'
        required: false
        default: ''
        type: string
      redis_mem_limit:
        description: 'Override redis memory limit (e.g. 192M). Wins over server_memory_mb.'
        required: false
        default: ''
        type: string
      mongo_mem_limit:
        description: 'Override mongo memory limit (e.g. 640M). Wins over server_memory_mb.'
        required: false
        default: ''
        type: string
      worker_mem_limit:
        description: 'Override background worker memory limit (e.g. 512M). Wins over server_memory_mb.'
        required: false
        default: ''
        type: string

      certbot_email:
        description: Certbot email
        required: false
        default: example@example.com
        type: string

      grafana_admin_user:
        description: Grafana admin user
        required: false
        default: admin
        type: string
      grafana_admin_password:
        description: Grafana admin password
        required: false
        default: password.example
        type: string

    secrets:
      server_host:
        required: true
      server_username:
        required: true
      server_password:
        required: true
      env:
        required: true
      database_certificate:
        required: false
      ghcr_username:
        required: false
      ghcr_token:
        required: false
      node_version:
        required: false
      registry_subname:
        required: false

      tg_token:
        required: false
      tg_chat_id:
        required: false
      tg_thread_id:
        required: false

      grafana_admin_user:
        description: Grafana admin user
        required: false
      grafana_admin_password:
        description: Grafana admin password
        required: false
      certbot_email:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

# cancel-in-progress must stay false: cancelling a deploy mid-flight can kill the server
# in a half-torn-down state (old containers removed, new ones not started yet).
concurrency:
  group: reusable-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ inputs.domain }}
      API_ENV: ${{ inputs.api_env }}
      ENV_FILE: ${{ inputs.env_file }}
      NGINX_MODE: ${{ inputs.nginx_mode }}
      MIGRATIONS_RUN: ${{ inputs.migrations_run }}
      DEPLOY_MODE: ${{ inputs.deploy_mode == 'registry' && 'registry' || 'default' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v2

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # `cache: pnpm` reuses the repo-scoped pnpm store (keyed by pnpm-lock.yaml) across runs —
      # shared with ci.yml, so the non-registry install below is a near-instant cache restore.
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Log start params
        run: |
          echo 'Event name: ${{ inputs.domain }}'
          echo 'Ref name: ${{ inputs.api_env }}'
          echo 'Env file: ${{ inputs.env_file }}'
          echo 'Nginx mode: ${{ inputs.nginx_mode }}'
          echo 'Certbot test mode: ${{ inputs.certbot_test_mode }}'
          echo 'Certbot email: ${{ inputs.certbot_email }}'
          echo 'Migrations run: ${{ inputs.migrations_run }}'
          echo 'Blue-green enabled: ${{ inputs.blue_green_enabled }}'
          echo 'Server host: ${{ secrets.server_host }}'

      - name: Send Telegram Message
        if: ${{ inputs.notify_enabled }}
        env:
          TG_TOKEN: ${{ secrets.tg_token }}
          TG_CHAT_ID: ${{ secrets.tg_chat_id }}
          TG_THREAD_ID: ${{ secrets.tg_thread_id }}
          TG_STATUS: start
          TG_TAG: ${{ inputs.tag }}
          TG_API_ENV: ${{ inputs.api_env }}
          TG_NGINX_MODE: ${{ inputs.nginx_mode }}
          TG_DOMAIN: ${{ inputs.domain }}
          TG_METRICS_ENABLED: ${{ inputs.metrics_enabled }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_BRANCH_URL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
          GITHUB_COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          GITHUB_AUTHOR_URL: https://github.com/${{ github.actor }}
          GITHUB_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          bash scripts/notify-telegram.sh

      - name: 📥 Install dependencies
        if: inputs.deploy_mode != 'registry'
        run: pnpm install --frozen-lockfile

      - name: 🧪 Unit tests (sanitize)
        if: inputs.deploy_mode != 'registry'
        run: pnpm run test

      - name: Create env and service-account.json files
        run: |
          # Write env from GitHub secret into env_file (supports multiline, quotes, etc.)
          cat <<'ENV_EOF' >> "${{ inputs.env_file }}"
          ${{ secrets.env }}
          ENV_EOF

          # NODE_ENV: production for prod, api_env for others
          if [ "${{ inputs.api_env }}" = "prod" ]; then
            echo "NODE_ENV=production" >> "${{ inputs.env_file }}"
          else
            echo "NODE_ENV=${{ inputs.api_env }}" >> "${{ inputs.env_file }}"
          fi

          # Server-only: correlate RUM / deploys (not NEXT_PUBLIC_* — never sent to the client bundle)
          echo "COMMIT_HASH=${{ github.sha }}" >> "${{ inputs.env_file }}"

          # Optional DB certificate
          if [ -n "${{ secrets.database_certificate }}" ]; then echo '${{ secrets.database_certificate }}' >> "db-certificate.${{ inputs.api_env }}.crt"; fi

      - name: 🐳 Set up Docker Buildx (registry mode)
        if: inputs.deploy_mode == 'registry'
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR and build core-api image (registry mode)
        if: inputs.deploy_mode == 'registry'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${{ inputs.registry_subname || 'service-image' }}:${{ github.sha }}"
          # Shared build-layer cache stored as a single (overwritten) :buildcache tag in GHCR.
          # Reused across runs and deploy restarts: the slow `pnpm install` / `next build` layers
          # are not rebuilt when package.json / lockfile / sources are unchanged.
          CACHE_REF="ghcr.io/${OWNER}/${{ inputs.registry_subname || 'service-image' }}:buildcache"

          # Extract only public variables (NEXT_PUBLIC_*, VAPID_SUBJECT) from the corresponding env file in the repository
          PUBLIC_ENV=$(grep -E '^(NEXT_PUBLIC_|VAPID_SUBJECT=)' "${{ inputs.env_file }}" || true)

          echo "Public env for build:"
          echo "$PUBLIC_ENV"

          docker buildx build \
            -f .docker/Dockerfile \
            --build-arg API_ENV=${{ inputs.api_env }} \
            --build-arg PUBLIC_ENV="$PUBLIC_ENV" \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
            -t "$IMAGE" \
            --push .
          echo "CORE_API_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: 🚀 Build project
        if: inputs.deploy_mode != 'registry'
        run: |
          if [ "${{ inputs.api_env }}" = "stage" ]; then pnpm run build:stage; else pnpm run build:prod; fi

      - name: 🗑️ Remove node_modules and .git
        run: |
          rm -rf node_modules .git .github

      - name: 📦 Copy project files to server (to app_new)
        uses: appleboy/scp-action@master
        with:
          source: "*"
          target: "~/app_new"
          port: 22
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_username }}
          password: ${{ secrets.server_password }}
          timeout: '300s'
          overwrite: true
          strip_components: 0

      - name: 🗑️ Remove all tar.gz files from server
        uses: appleboy/ssh-action@master
        env:
          GH_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_username }}
          password: ${{ secrets.server_password }}
          port: 22
          envs: GH_USERNAME, GITHUB_TOKEN
          script: |
            find ~ -type f -name '*.tar.gz' -exec rm -f {} +

      - name: 🚀 Prepare and run on server (Blue/Green or Cold)
        id: deploy_run
        uses: appleboy/ssh-action@master
        # Must be >= command_timeout below, otherwise GitHub kills the step mid-deploy
        # and leaves the server half-torn-down (old containers removed, new not started).
        timeout-minutes: 30
        env:
          GH_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTBOT_TEST_MODE: ${{ inputs.certbot_test_mode }}
          CERTBOT_EMAIL: ${{ secrets.certbot_email || inputs.certbot_email }}
          DOMAINS: ${{ inputs.domain }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          CORE_API_IMAGE: ${{ env.CORE_API_IMAGE }}
          GHCR_USERNAME: ${{ secrets.ghcr_username }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          GRAFANA_ADMIN_USER: ${{ secrets.grafana_admin_user }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.grafana_admin_password }}
          REDIS_ENABLED: ${{ inputs.redis_enabled }}
          METRICS_ENABLED: ${{ inputs.metrics_enabled }}
          MONGO_ENABLED: ${{ inputs.mongo_enabled }}
          WORKER_ENABLED: ${{ inputs.worker_enabled }}
          SERVER_MEMORY_MB: ${{ inputs.server_memory_mb }}
          API_MEM_LIMIT: ${{ inputs.api_mem_limit }}
          REDIS_MEM_LIMIT: ${{ inputs.redis_mem_limit }}
          MONGO_MEM_LIMIT: ${{ inputs.mongo_mem_limit }}
          WORKER_MEM_LIMIT: ${{ inputs.worker_mem_limit }}
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_username }}
          password: ${{ secrets.server_password }}
          port: 22
          envs: GH_USERNAME, GITHUB_TOKEN, DEPLOY_MODE, CORE_API_IMAGE, GHCR_USERNAME, GHCR_TOKEN, GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD, REDIS_ENABLED, METRICS_ENABLED, MONGO_ENABLED, WORKER_ENABLED, SERVER_MEMORY_MB, API_MEM_LIMIT, REDIS_MEM_LIMIT, MONGO_MEM_LIMIT, WORKER_MEM_LIMIT
          command_timeout: 25m
          script: |
            set -e
            export COMPOSE_HTTP_TIMEOUT=300
            if [ "$DEPLOY_MODE" = "registry" ]; then
              if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
                echo "Error: GHCR_USERNAME and GHCR_TOKEN secrets are required when deploy_mode=registry"
                exit 1
              fi
              echo "Logging in to ghcr.io..."
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin || exit 1
            fi

            REDIS_ENABLED=${REDIS_ENABLED:-false}
            METRICS_ENABLED=${METRICS_ENABLED:-false}
            MONGO_ENABLED=${MONGO_ENABLED:-false}
            WORKER_ENABLED=${WORKER_ENABLED:-false}
            CORE_UP="core-api"; [ "$REDIS_ENABLED" = "true" ] && CORE_UP="$CORE_UP redis"; [ "$MONGO_ENABLED" = "true" ] && CORE_UP="$CORE_UP mongo"
            METRICS_SERVICES="prometheus nginx-prometheus-exporter prometheus-node-exporter cadvisor promtail loki telegraf grafana"
            EXTRA_UP="certbot"; [ "$METRICS_ENABLED" = "true" ] && EXTRA_UP="$EXTRA_UP $METRICS_SERVICES"; [ "$REDIS_ENABLED" = "true" ] && EXTRA_UP="$EXTRA_UP redis"; [ "$MONGO_ENABLED" = "true" ] && EXTRA_UP="$EXTRA_UP mongo"
            # Background worker (headless BullMQ crons): a stateless singleton, no blue/green.
            # Force-recreated on each deploy so it picks up the new image; a brief restart is acceptable.
            [ "$WORKER_ENABLED" = "true" ] && EXTRA_UP="$EXTRA_UP worker"
            # Only stateless helpers get force-recreated after deploy. Never stop/rm redis or mongo
            # under a live API: it turns every deploy into a short DB outage (429s/500s).
            # `up -d` below is a no-op for already-running services with unchanged config.
            EXTRA_STOP="certbot"; [ "$METRICS_ENABLED" = "true" ] && EXTRA_STOP="$EXTRA_STOP $METRICS_SERVICES"
            [ "$WORKER_ENABLED" = "true" ] && EXTRA_STOP="$EXTRA_STOP worker"

            docker volume create letsencrypt_certs || true
            docker volume create certbot_logs || true

            USE_BG=false
            if [ "${{ inputs.blue_green_enabled }}" = "true" ]; then
              if docker ps --format '{{.Names}}' | grep -q '^api-service$'; then
                if docker ps --filter name=api-service --format '{{.Status}}' | grep -q 'healthy'; then
                  USE_BG=true
                  echo "Blue-green enabled and found healthy api-service container, using Blue/Green deploy"
                else
                  echo "Blue-green enabled but api-service container not healthy, using cold deploy"
                fi
              else
                echo "Blue-green enabled but no api-service container found, using cold deploy"
              fi
            else
              echo "Blue-green deployment disabled, using cold deploy"
            fi

            if [ "$USE_BG" = true ]; then
              echo "Blue/Green mode: validating GREEN in app_new..."
              if [ -d "$HOME/app_new" ]; then
                cd "$HOME/app_new"
                chmod +x scripts/local-containers-run.sh || true
                if ! MIGRATIONS_RUN=${{ inputs.migrations_run }} ./scripts/local-containers-run.sh bg-validate ${{ inputs.api_env }}; then
                  echo "Blue/Green validation failed. Cleaning up and falling back to cold deploy."
                  docker stop api-service-green redis-green mongo-green 2>/dev/null || true
                  docker rm -f api-service-green redis-green mongo-green 2>/dev/null || true
                  cd "$HOME"
                  USE_BG=false
                else
                  echo "GREEN validation successful. Proceeding with Blue/Green deploy."
                fi
                if [ "$USE_BG" = true ]; then
                  cd "$HOME"
                  echo "GREEN validated. Performing fast swap..."
                  rm -rf "$HOME/app.bak" || true
                  if [ -d "$HOME/app" ]; then mv "$HOME/app" "$HOME/app.bak" || true; fi
                  mv "$HOME/app_new" "$HOME/app"
                  cd "$HOME/app"
                  chmod +x scripts/local-containers-run.sh || true
                  # Same memory-limit env as inside the script — otherwise the inline
                  # `up -d` calls below would see a different config and recreate redis/mongo.
                  . scripts/lib/memory-limits.sh && compute_memory_limits
                  set -a; [ -f "${{ inputs.env_file }}" ] && . "./${{ inputs.env_file }}"; set +a; export ENV_FILE="${{ inputs.env_file }}"
                  # Only the app container gets force-recreated: redis/mongo keep running
                  # (compose `up -d` below recreates them automatically if their config changed).
                  BG_STOP="core-api"
                  API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }} \
                    docker-compose -f docker-compose.local.yml stop $BG_STOP || true
                  API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }} \
                    docker-compose -f docker-compose.local.yml rm -f $BG_STOP || true
                  if [ "$DEPLOY_MODE" = "registry" ] && [ -n "$CORE_API_IMAGE" ]; then
                    docker pull "$CORE_API_IMAGE"
                  else
                    API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }} \
                      docker-compose -f docker-compose.local.yml build --no-cache core-api
                  fi
                  ( set -a; [ -f "${{ inputs.env_file }}" ] && . "./${{ inputs.env_file }}"; set +a; export ENV_FILE="${{ inputs.env_file }}" API_ENV=${{ inputs.api_env }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }} CORE_API_IMAGE="$CORE_API_IMAGE"; docker-compose -f docker-compose.local.yml up -d $CORE_UP )
                  # Wait for the new api to become healthy before declaring the swap done
                  echo "Waiting for new api-service to become healthy..."
                  attempts=0; max_attempts=150
                  while true; do
                    # exact name (docker ps name filter would also match api-service-green)
                    status=$(docker inspect api-service --format '{{.State.Health.Status}}' 2>/dev/null || true)
                    if [ "$status" = "healthy" ]; then echo "api-service is healthy"; break; fi
                    attempts=$((attempts+1))
                    if [ $attempts -ge $max_attempts ]; then
                      echo "Error: api-service failed to become healthy after swap"
                      docker logs --tail=200 api-service 2>&1 || true
                      exit 1
                    fi
                    sleep 2
                  done
                  # Restart nginx so it picks up the new upstream immediately
                  # (the resolver in nginx.conf re-resolves within 10s anyway; this is belt-and-braces)
                  ( set -a; [ -f "${{ inputs.env_file }}" ] && . "./${{ inputs.env_file }}"; set +a; export ENV_FILE="${{ inputs.env_file }}" API_ENV=${{ inputs.api_env }} NGINX_MODE=${{ inputs.nginx_mode }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }}; docker-compose -f docker-compose.local.yml restart nginx || true )
                  MIGRATIONS_RUN=${{ inputs.migrations_run }} ./scripts/local-containers-run.sh bg-down ${{ inputs.api_env }} || true
                  API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} NGINX_MODE=${{ inputs.nginx_mode }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} \
                    docker-compose -f docker-compose.local.yml stop $EXTRA_STOP || true
                  API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} NGINX_MODE=${{ inputs.nginx_mode }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} \
                    docker-compose -f docker-compose.local.yml rm -f $EXTRA_STOP || true
                  ( set -a; [ -f "${{ inputs.env_file }}" ] && . "./${{ inputs.env_file }}"; set +a; export ENV_FILE="${{ inputs.env_file }}" API_ENV=${{ inputs.api_env }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }}; docker-compose -f docker-compose.local.yml up -d $EXTRA_UP )
                fi
              else
                echo "No app_new found. Falling back to cold deploy path."
                if [ -d "$HOME/app" ]; then
                  cd "$HOME/app" && [ -x scripts/local-containers-run.sh ] && ./scripts/local-containers-run.sh clean || true
                fi
                rm -rf "$HOME/app.bak" || true
                if [ -d "$HOME/app" ]; then mv "$HOME/app" "$HOME/app.bak" || true; fi
                mv "$HOME/app_new" "$HOME/app"
                cd "$HOME/app" && chmod +x scripts/local-containers-run.sh
                MIGRATIONS_RUN=${{ inputs.migrations_run }} CERTBOT_TEST_MODE=${{ inputs.certbot_test_mode }} CERTBOT_EMAIL=${{ secrets.certbot_email || inputs.certbot_email }} REDIS_ENABLED=$REDIS_ENABLED METRICS_ENABLED=$METRICS_ENABLED MONGO_ENABLED=$MONGO_ENABLED ./scripts/local-containers-run.sh https ${{ inputs.api_env }} -d ${{ inputs.domain }}
              fi
            else
              echo "Cold deploy path..."
              if [ -d "$HOME/app_new" ]; then
                if [ -d "$HOME/app" ]; then
                  cd "$HOME/app" && [ -x scripts/local-containers-run.sh ] && ./scripts/local-containers-run.sh clean || true
                  cd "$HOME"
                fi
                rm -rf "$HOME/app.bak" || true
                if [ -d "$HOME/app" ]; then mv "$HOME/app" "$HOME/app.bak" || true; fi
                mv "$HOME/app_new" "$HOME/app"
              fi
              cd "$HOME/app"
              chmod +x scripts/local-containers-run.sh
              # Same memory-limit env as inside the script — needed by the inline compose calls below.
              . scripts/lib/memory-limits.sh && compute_memory_limits
              MIGRATIONS_RUN=${{ inputs.migrations_run }} CERTBOT_TEST_MODE=${{ inputs.certbot_test_mode }} CERTBOT_EMAIL=${{ secrets.certbot_email || inputs.certbot_email }} REDIS_ENABLED=$REDIS_ENABLED METRICS_ENABLED=$METRICS_ENABLED MONGO_ENABLED=$MONGO_ENABLED ./scripts/local-containers-run.sh https ${{ inputs.api_env }} -d ${{ inputs.domain }}
              # The https script above already (re)created core-api/redis/mongo.
              # Only refresh stateless helpers here; redis/mongo stay untouched (no outage window).
              API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} NGINX_MODE=${{ inputs.nginx_mode }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} \
                docker-compose -f docker-compose.local.yml stop $EXTRA_STOP || true
              API_ENV=${{ inputs.api_env }} ENV_FILE=${{ inputs.env_file }} NGINX_MODE=${{ inputs.nginx_mode }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} \
                docker-compose -f docker-compose.local.yml rm -f $EXTRA_STOP || true
              ( set -a; [ -f "${{ inputs.env_file }}" ] && . "./${{ inputs.env_file }}"; set +a; export ENV_FILE="${{ inputs.env_file }}" API_ENV=${{ inputs.api_env }} DOMAINS=${{ inputs.domain }} FIRST_DOMAIN=${{ inputs.domain }} NGINX_MODE=${{ inputs.nginx_mode }}; docker-compose -f docker-compose.local.yml up -d $EXTRA_UP )
            fi

      - name: 🧹 Cleanup backup on success
        if: always() && steps.deploy_run.outcome == 'success'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_username }}
          password: ${{ secrets.server_password }}
          port: 22
          script: |
            export COMPOSE_HTTP_TIMEOUT=300
            if [ -d "$HOME/app.bak" ]; then
              echo "Cleaning app.bak after successful deploy..."
              rm -rf "$HOME/app.bak"
            fi

            echo "Logs certbot-init:"

            cd $HOME/app || true
            docker-compose -f docker-compose.local.yml logs certbot-init || true

      - name: 🧹 Cleanup app_new containers and images
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_username }}
          password: ${{ secrets.server_password }}
          port: 22
          script: |
            export COMPOSE_HTTP_TIMEOUT=300
            echo "Logs certbot-init:"
            cd $HOME/app || true
            docker-compose -f docker-compose.local.yml logs certbot-init || true

            echo "Restarting nginx with proper env context after deploy..."
            API_ENV=${{ inputs.api_env }} \
            ENV_FILE=${{ inputs.env_file }} \
            NGINX_MODE=${{ inputs.nginx_mode }} \
            DOMAINS=${{ inputs.domain }} \
            FIRST_DOMAIN=${{ inputs.domain }} \
              docker-compose -f docker-compose.local.yml restart nginx || true

            echo "🧹 Starting Docker cleanup..."
            docker images --filter "reference=app_new_*" --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}" || true
            docker rmi $(docker images --filter "reference=app_new_*" --format "{{.ID}}") 2>/dev/null || true
            echo "Removing app_new volumes (if exist)..."
            docker volume rm app_new_mongo_data app_new_redis_data 2>/dev/null || true

            # Remove old registry images (ghcr.io/owner/name:*): keep only the image used by api-service
            CURRENT_IMAGE=$(docker inspect api-service --format '{{.Config.Image}}' 2>/dev/null || true)
            if [ -n "$CURRENT_IMAGE" ] && [[ "$CURRENT_IMAGE" == *"/"* ]]; then
              REPO="${CURRENT_IMAGE%:*}"
              echo "Keeping current api image: $CURRENT_IMAGE"
              docker images "$REPO" --format "{{.Repository}}:{{.Tag}}" 2>/dev/null | while read -r img; do
                if [ -n "$img" ] && [ "$img" != "$CURRENT_IMAGE" ] && [ "$img" != "<none>:<none>" ]; then
                  echo "Removing old image: $img"
                  docker rmi "$img" 2>/dev/null || true
                fi
              done
            fi

            docker images --filter "dangling=true" --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}" || true
            docker image prune -f || true
            docker container prune -f || true
            docker builder prune -f || true
            # NO `docker volume prune` here: this step runs even when the deploy failed,
            # and with containers torn down it would delete mongo_data / redis_data /
            # letsencrypt_certs (i.e. the database and certificates).

            echo "✅ Docker cleanup completed"

      
  failure-notify:
    if: ${{ failure() && inputs.notify_enabled }}
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout repo
      uses: actions/checkout@v2
    - name: Send Telegram Message
      env:
        TG_TOKEN: ${{ secrets.tg_token }}
        TG_CHAT_ID: ${{ secrets.tg_chat_id }}
        TG_THREAD_ID: ${{ secrets.tg_thread_id }}
        TG_STATUS: error
        TG_TAG: ${{ inputs.tag }}
        TG_API_ENV: ${{ inputs.api_env }}
        TG_NGINX_MODE: ${{ inputs.nginx_mode }}
        TG_DOMAIN: ${{ inputs.domain }}
        TG_METRICS_ENABLED: ${{ inputs.metrics_enabled }}
        GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GITHUB_BRANCH_URL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
        GITHUB_COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        GITHUB_AUTHOR_URL: https://github.com/${{ github.actor }}
        GITHUB_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
