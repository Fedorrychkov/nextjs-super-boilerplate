name: Quality

# Reusable quality gate: gates + lint + typecheck + test.
# Called by ci.yml (on PR / push) and by prod-deploy.yml (before deploy) so the
# checks are defined once and shared.
#
# `gates` runs the scripts/check-*.mjs family (scripts/gates.mjs) — repository-wide checks eslint
# structurally cannot do: the agent contract fits the tools' limits, the eslint-disable count only
# shrinks. fail-fast stays false so one red task never hides another: fixing three problems should
# take one CI round, not three.
#
# `test` needs NOTHING: no database, no redis, no network. That is a rule, not a coincidence — a
# suite that needs infrastructure is a suite that gets skipped, and a skipped suite reports green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [gates, lint, typecheck, test]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # `cache: pnpm` reuses the repo-scoped pnpm store (keyed by pnpm-lock.yaml)
      # across jobs, PRs, re-runs and other workflows (ci.yml, deploy).
      - name: ⎔ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}
