name: Production Deploy
on:
  push:
    branches:
      - main
    # A push that touches only what never reaches the image or the server does not restart the
    # stack: documentation, agent files, patches, CI-only workflows. Everything else deploys.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'patch/**'
      - 'skills/**'
      - '.claude/**'
      - 'lighthouserc.json'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/notify-telegram.yml'
      - '.github/workflows/ci-secret-scan.yml'

  # Manual run: Actions → Production Deploy → Run workflow (branch can be selected in UI)
  workflow_dispatch:

# The minimum the pipeline uses: read the repo, push the image to GHCR. Nothing here writes to
# the repository, issues or releases, so a leaked GITHUB_TOKEN could not either.
permissions:
  contents: read
  packages: write

# cancel-in-progress: false — a second push to main queues instead of cancelling the
# running deploy. Cancelling mid-deploy leaves the server with containers torn down.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # Gate: lint + typecheck + test must pass before the deploy job runs.
  # Runs on both `push` to main and manual `workflow_dispatch`.
  quality:
    uses: ./.github/workflows/quality.yml

  call-reusable:
    needs: [quality]
    uses: ./.github/workflows/reusable-deploy-config.yml
    with:
      domain: nextjs-super-boilerplate.visn-ai.io
      api_env: prod
      env_file: .env.prod
      # Public (non-secret) part of the environment from Settings → Variables. The secret
      # `WEB_ENV_PROD` keeps whatever contains a credential; everything else may move here and
      # becomes reviewable. Empty variable = everything still comes from the secret.
      env_public: ${{ vars.WEB_ENV_PUBLIC_PROD }}
      # `pnpm doctor:prod` on the assembled env BEFORE the deploy: a wrong MONGO_URI / REDIS_URL
      # (e.g. localhost inside a container) fails here, not on the server after a torn-down stack.
      doctor_check_enabled: true
      nginx_mode: https
      certbot_test_mode: false
      migrations_run: false
      blue_green_enabled: false
      deploy_mode: 'registry'
      node_version: 24
      registry_subname: 'nextjs-super-boilerplate'
      notify_enabled: true
      tag: 'nextjs-super-boilerplate'
      redis_enabled: true
      # Grafana 13 needs ~450M on a Loki query; with server_memory_mb: 2048 the metrics pool gives
      # it ~254M and it is OOM-killed on the first dashboard. Enable again with server_memory_mb
      # >= 4096 (the real RAM of the box), see docs/DECISIONS_RU.md §7.
      metrics_enabled: false
      mongo_enabled: true
      # Background worker (scripts/worker.ts — BullMQ crons, headless singleton).
      # Needs redis_enabled: true. See docs/CRON_ARCHITECTURE_PORTABLE_RU.md.
      # worker_enabled: true
      # Total server RAM: container limits are derived from this single number
      # (scripts/lib/memory-limits.sh). Fine-tune with api_mem_limit / redis_mem_limit /
      # mongo_mem_limit / worker_mem_limit if needed.
      server_memory_mb: 2048
      worker_enabled: false
      mongo_backup_enabled: true
      mongo_backup_cron: '30 3 * * *'
      mongo_backup_retention: 2

    secrets:
      server_host: ${{ secrets.PROD_WEB_HOST }}
      server_username: ${{ secrets.PROD_WEB_USERNAME }}
      # Either is enough; the key wins when both are set. Missing secrets evaluate to empty.
      server_password: ${{ secrets.PROD_WEB_PASSWORD }}
      server_ssh_key: ${{ secrets.PROD_WEB_SSH_KEY }}
      server_ssh_fingerprint: ${{ secrets.PROD_WEB_SSH_FINGERPRINT }}
      env: ${{ secrets.WEB_ENV_PROD }}
      ghcr_username: ${{ secrets.GHCR_USERNAME }}
      ghcr_token: ${{ secrets.GHCR_TOKEN }}
      tg_token: ${{ secrets.TG_TOKEN }}
      tg_chat_id: ${{ secrets.TG_CHAT_ID }}
      tg_thread_id: ${{ secrets.TG_THREAD_ID }}
      grafana_admin_user: ${{ secrets.GRAFANA_ADMIN_USER }}
      grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      certbot_email: ${{ secrets.CERTBOT_EMAIL || 'example@example.com' }}
