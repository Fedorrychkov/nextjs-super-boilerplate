name: Secret scan

# Отдельный workflow, а не джоба в quality.yml, и без paths-фильтра намеренно: гейт на секреты не
# должен выключаться от того, какие файлы тронуты — секрет может попасть и в `.md`. Сканируется
# отслеживаемое дерево (git archive), а не рабочая копия раннера: локальные `.env.*` в git не
# попадают и здесь не мешают. История репозитория не сканируется — это разовая работа владельца
# (ротация + purge), гейт ловит НОВЫЙ секретный материал в PR.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked tree
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/gitleaks-tree"
      - name: gitleaks
        run: |
          docker run --rm -v "$RUNNER_TEMP/gitleaks-tree:/scan:ro" ghcr.io/gitleaks/gitleaks:latest \
            dir /scan --redact --no-banner
