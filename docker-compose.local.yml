version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.2
    container_name: prometheus
    restart: always
    user: root
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-512M}
    volumes:
      - ./grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./grafana/prometheus/data:/prometheus
    networks:
      - api_network
    depends_on:
      - nginx
      - core-api
    expose:
      - 9090
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:1.0
    restart: always
    container_name: prometheus-nginx-exporter
    deploy:
      resources:
        limits:
          memory: ${EXPORTER_MEM_LIMIT:-512M}
    command:
      - -nginx.scrape-uri=https://nginx-container/nginx_status
    expose: 
      - 9113
    networks:
      - api_network
    depends_on:
      - prometheus
      - nginx
      - core-api
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  prometheus-node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: always
    container_name: prometheus-node-exporter
    deploy:
      resources:
        limits:
          memory: ${EXPORTER_MEM_LIMIT:-512M}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    networks:
      - api_network
    privileged: true
    depends_on:
      - prometheus
      - nginx
      - core-api
    expose:
      - 9100
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: always
    container_name: cadvisor
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEM_LIMIT:-256M}
    depends_on:
      - prometheus
      - nginx
      - core-api
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - 8081
    networks:
      - api_network
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  promtail:
    image: grafana/promtail:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: ${PROMTAIL_MEM_LIMIT:-512M}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./grafana/promtail-config.yml:/etc/promtail/promtail-config.yml
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - nginx
      - core-api
    networks:
      - api_network
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEM_LIMIT:-512M}
    volumes:
      - ./grafana/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - api_network
    depends_on:
      - nginx
      - core-api
    expose:
      - 3100
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: always
    deploy:
      resources:
        limits:
          memory: ${TELEGRAF_MEM_LIMIT:-512M}
    environment:
      - MONGO_METRICS_USER=${MONGO_USER:-admin}
      - MONGO_METRICS_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - ./grafana/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf
    networks:
      - api_network
    expose:
      - 9273 # Telegraf metrics export port for Prometheus
    depends_on:
      - prometheus
      - nginx-prometheus-exporter
      - nginx
      - core-api
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-300M}
    volumes:
      - ./grafana/datasource:/etc/grafana/provisioning/datasources/
      - ./grafana/dashboard:/etc/grafana/provisioning/dashboards/
    expose:
      - 3000
    depends_on:
      - core-api
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-password.example}
      - GF_SERVER_ROOT_URL=https://${FIRST_DOMAIN:-app.example.local}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - api_network
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  # Main API service (may be renamed in blue/green)
  core-api:
    container_name: api-service${SUFFIX}
    image: ${CORE_API_IMAGE:-app_core-api:latest}
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
      args:
        - API_ENV=${API_ENV:-prod}
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ${ENV_FILE:-.env}:/usr/src/api/${ENV_FILE:-.env}:ro
      - ./db-certificate.${API_ENV:-prod}.crt:/usr/src/api/db-certificate.${API_ENV:-prod}.crt:ro
    environment:
      - API_ENV=${API_ENV:-prod}
      # Set via scripts/lib/memory-limits.sh (SERVER_MEMORY_MB) or explicit override; empty = Node defaults.
      - NODE_OPTIONS=${API_NODE_OPTIONS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Configure via SERVER_MEMORY_MB / API_MEM_LIMIT (see scripts/lib/memory-limits.sh)
          memory: ${API_MEM_LIMIT:-2g}
        reservations:
          memory: ${API_MEM_RESERVATION:-512M}
    networks:
      - api_network

  nginx:
    container_name: core-nginx-service
    environment:
      - NGINX_MODE=${NGINX_MODE:-http}
      - DOMAINS=${DOMAINS:-app.example.local,www.app.example.local}
      - FIRST_DOMAIN=${FIRST_DOMAIN:-app.example.local}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
    healthcheck:
      test: |
        /bin/sh -c '
        if [ "${NGINX_MODE}" = "https" ]; then
          curl -k https://localhost/.well-known/acme-challenge/health || exit 1;
        else
          curl -f http://localhost/.well-known/acme-challenge/health || exit 1;
        fi'
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: >
      /bin/sh -c "
      mkdir -p /var/www/certbot/.well-known/acme-challenge &&
      echo 'OK' > /var/www/certbot/.well-known/acme-challenge/health &&
      export DOMAINS='${DOMAINS}' &&
      export FIRST_DOMAIN='${FIRST_DOMAIN}' &&
      echo 'Using domains: '$DOMAINS &&
      echo 'Using first domain: '$FIRST_DOMAIN &&
      if [ \"$${METRICS_ENABLED}\" != \"true\" ]; then
        sed '/# METRICS_GRAFANA_UPSTREAM_START/,/# METRICS_GRAFANA_UPSTREAM_END/d; /# METRICS_GRAFANA_LOCATION_START/,/# METRICS_GRAFANA_LOCATION_END/d' /etc/nginx/nginx.conf.template.$${NGINX_MODE} > /tmp/nginx.conf.tpl;
      else
        cp /etc/nginx/nginx.conf.template.$${NGINX_MODE} /tmp/nginx.conf.tpl;
      fi &&
      envsubst '$${DOMAINS} $${FIRST_DOMAIN}' < /tmp/nginx.conf.tpl > /etc/nginx/nginx.conf &&
      nginx -t &&
      nginx -g 'daemon off;'"
    volumes:
      - ./.docker/nginx/nginx.conf.template.http:/etc/nginx/nginx.conf.template.http:ro
      - ./.docker/nginx/nginx.conf.template.https:/etc/nginx/nginx.conf.template.https:ro
      - ./certbot/www:/var/www/certbot/:rw
      - letsencrypt_certs:/etc/letsencrypt/:ro
      - certbot_logs:/var/log/certbot:ro
    build:
      context: .
      dockerfile: ./.docker/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - api_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      core-api:
        condition: service_started

  # Initial certificate issuance service
  certbot-init:
    container_name: service-api-certbot-init
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-example@example.com}
      - DOMAINS=${DOMAINS:-app.example.local}
      - CERTBOT_TEST_MODE=${CERTBOT_TEST_MODE:-false}
    build:
      context: .
      dockerfile: ./.docker/Dockerfile.certbot.init
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - letsencrypt_certs:/etc/letsencrypt:rw
      - certbot_logs:/var/log/certbot:rw
    networks:
      - api_network
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "500m"
        max-file: "1"
    depends_on:
      nginx:
        condition: service_healthy
    restart: "no"

  # Automatic certificate renewal service
  certbot:
    container_name: service-api-certbot
    build:
      context: .
      dockerfile: ./.docker/Dockerfile.certbot
    entrypoint: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/certbot.conf"]
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - letsencrypt_certs:/etc/letsencrypt:rw
      - certbot_logs:/var/log/certbot:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-example@example.com}
      - DOMAINS=${DOMAINS:-app.example.local}
      - CERTBOT_TEST_MODE=${CERTBOT_TEST_MODE:-false}
    networks:
      - api_network
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "500m"
        max-file: "1"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  redis:
    container_name: redis${SUFFIX}
    image: redis:7.2-alpine
    # maxmemory 0 = unlimited (redis default); set via SERVER_MEMORY_MB / REDIS_MAXMEMORY.
    # This redis backs rate-limiting + caching. `noeviction` makes writes fail when full instead
    # of silently dropping keys; if you use it mainly as an evictable cache with a hard limit,
    # set REDIS_MAXMEMORY_POLICY=allkeys-lru.
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-0}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-noeviction}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api_network
    expose:
      - 6379
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          # 0 = unlimited (historical default); set via SERVER_MEMORY_MB / REDIS_MEM_LIMIT
          memory: ${REDIS_MEM_LIMIT:-0}
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

  mongo:
    container_name: mongo${SUFFIX}
    image: mongo:7
    # WiredTiger cache: mongod's own default is ~50% of host RAM, which starves everything
    # else on a small box. 0.5GB default ~= mongod's auto value on a 2GB host.
    # Set via SERVER_MEMORY_MB / MONGO_CACHE_GB (see scripts/lib/memory-limits.sh).
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.5}"]
    restart: always
    deploy:
      resources:
        limits:
          # 0 = unlimited (historical default); set via SERVER_MEMORY_MB / MONGO_MEM_LIMIT
          memory: ${MONGO_MEM_LIMIT:-0}
    # MONGO_INITDB_* are substituted on the host; ensure MONGO_USER/MONGO_PASSWORD are in shell (load_env_into_shell / workflow source)
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-app}
    networks:
      - api_network
    expose:
      - 27017
    volumes:
      - mongo_data:/data/db
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: "2g"
        max-file: "3"

volumes:
  redis_data:
  mongo_data:
  letsencrypt_certs:
    name: letsencrypt_certs
  certbot_logs:
    name: certbot_logs

networks:
  api_network:
    name: service-api-network
    driver: bridge
